<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="t-p7-correct"><title id="t-p7-correct">틀렸으면 빨리, 명확하게 정정한다</title><defs><style>
text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif}
.bg{fill:var(--fig-bg,#fcfcfb)}
.pn{fill:var(--fig-panel,#f1f2f4)}
.ink{fill:var(--fig-ink,#1c2230)}
.sub{fill:var(--fig-sub,#52514e)}
.mut{fill:var(--fig-mut,#898781)}
.ax{stroke:var(--fig-axis,#c3c2b7);fill:none}
.gr{stroke:var(--fig-grid,#e1e0d9);fill:none}
.ed{stroke:var(--fig-edge,#7d8797);fill:none}
.ah{fill:var(--fig-edge,#7d8797)}
.ring{stroke:var(--fig-bg,#fcfcfb)}
.f0{fill:var(--fig-0w,#eef0f3)} .s0{stroke:var(--fig-0,#8a94a6)} .k0{fill:var(--fig-0,#8a94a6)} .l0{stroke:var(--fig-0,#8a94a6);fill:none}
.f1{fill:var(--fig-1w,#dbe8fa)} .s1{stroke:var(--fig-1,#2a78d6)} .k1{fill:var(--fig-1,#2a78d6)} .l1{stroke:var(--fig-1,#2a78d6);fill:none}
.f2{fill:var(--fig-2w,#fbe1d5)} .s2{stroke:var(--fig-2,#eb6834)} .k2{fill:var(--fig-2,#eb6834)} .l2{stroke:var(--fig-2,#eb6834);fill:none}
.f3{fill:var(--fig-3w,#d3f1e5)} .s3{stroke:var(--fig-3,#1baf7a)} .k3{fill:var(--fig-3,#1baf7a)} .l3{stroke:var(--fig-3,#1baf7a);fill:none}
.f4{fill:var(--fig-4w,#fcefcc)} .s4{stroke:var(--fig-4,#eda100)} .k4{fill:var(--fig-4,#eda100)} .l4{stroke:var(--fig-4,#eda100);fill:none}
.f5{fill:var(--fig-5w,#e3dff7)} .s5{stroke:var(--fig-5,#4a3aa7)} .k5{fill:var(--fig-5,#4a3aa7)} .l5{stroke:var(--fig-5,#4a3aa7);fill:none}
.q1{fill:var(--fig-q1,#cde2fb)} .q2{fill:var(--fig-q2,#9ec5f4)} .q3{fill:var(--fig-q3,#6da7ec)}
.good{fill:#0ca30c} .crit{fill:#d03b3b} .critl{stroke:#d03b3b;fill:none} .critw{fill:#d03b3b;fill-opacity:.28}
.m-si{fill:var(--m-si,#c7ccd6)} .m-ox{fill:var(--m-ox,#cfe3f4)} .m-pr{fill:var(--m-pr,#cbbbe9)}
.m-cu{fill:var(--m-cu,#e09a5f)} .m-ni{fill:var(--m-ni,#a9b1bd)} .m-sn{fill:var(--m-sn,#dfe5ec)}
.m-imc{fill:var(--m-imc,#8f7b66)} .m-al{fill:var(--m-al,#b7c4d6)} .m-emc{fill:var(--m-emc,#4c5363)}
.m-sub{fill:var(--m-sub,#7f9c78)} .m-n{fill:var(--m-n,#9fc3f0)} .m-p{fill:var(--m-p,#f2d2c2)} .m-gate{fill:var(--m-gate,#8b93a7)}
.m-bath{fill:var(--m-bath,#e7f1fb)}
.nterm{fill:var(--n-term-fill,#e8f6ee);stroke:var(--n-term-stroke,#2e9e5b)}
.nproc{fill:var(--n-process-fill,#ffffff);stroke:var(--n-process-stroke,#8a94a6)}
.ndec{fill:var(--n-decision-fill,#fff6e3);stroke:var(--n-decision-stroke,#d9921a)}
.nio{fill:var(--n-io-fill,#edf2ff);stroke:var(--n-io-stroke,#5b7bd5)}
.mono{font-family:ui-monospace,'D2Coding',Consolas,monospace}
</style><marker id="ah-p7-correct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="290" rx="12"/><rect class="pn" x="20" y="16" width="420" height="258" rx="10"/><rect class="f1" x="20" y="16" width="420" height="40" rx="10"/><rect class="f1" x="20" y="46" width="420" height="10" rx="0"/><text class="ink" x="36" y="42" font-size="13" text-anchor="start" font-weight="700">제목: [정정] 범프 높이 산포 분석 rev.2</text><circle class="f2 s2" cx="46" cy="90" r="13" stroke-width="1.4"/><text class="ink" x="46" y="95" font-size="13" text-anchor="middle" font-weight="700">①</text><text class="ink" x="68" y="88" font-size="13" text-anchor="start" font-weight="700">원래 무엇이라고 했는가</text><text class="sub" x="68" y="108" font-size="12" text-anchor="start">“분리 한계는 2.23 µm”</text><circle class="f2 s2" cx="46" cy="152" r="13" stroke-width="1.4"/><text class="ink" x="46" y="157" font-size="13" text-anchor="middle" font-weight="700">②</text><text class="ink" x="68" y="150" font-size="13" text-anchor="start" font-weight="700">무엇이, 왜 틀렸는가</text><text class="sub" x="68" y="170" font-size="12" text-anchor="start">IMC 가정에 따라 값이 달라지는데 한 값으로 단정</text><circle class="f2 s2" cx="46" cy="214" r="13" stroke-width="1.4"/><text class="ink" x="46" y="219" font-size="13" text-anchor="middle" font-weight="700">③</text><text class="ink" x="68" y="212" font-size="13" text-anchor="start" font-weight="700">결론이 바뀌는가</text><text class="sub" x="68" y="232" font-size="12" text-anchor="start">대책 방향은 같음, 한계는 범위로 표시</text><text class="mut" x="36" y="264" font-size="12" text-anchor="start">→ 첨부를 이 파일로 교체해 주십시오</text><text class="ink" x="580" y="44" font-size="13.5" text-anchor="middle" font-weight="700">신뢰는 어떻게 바뀌나</text><rect class="f3 s3" x="470" y="66" width="220" height="62" rx="10" stroke-width="1.5"/><text class="ink" x="580" y="91.4" font-size="14" text-anchor="middle" font-weight="600">발견 당일 정정</text><text class="sub" x="580" y="113.6" font-size="11.5" text-anchor="middle">“이 사람 자료는 검증된다”</text><rect class="f2 s2" x="470" y="152" width="220" height="62" rx="10" stroke-width="1.5"/><text class="ink" x="580" y="177.4" font-size="14" text-anchor="middle" font-weight="600">숨겼다가 남이 발견</text><text class="sub" x="580" y="199.6" font-size="11.5" text-anchor="middle">“이 사람 자료는 다시 봐야 한다”</text><text class="sub" x="580" y="248" font-size="12.5" text-anchor="middle">정정은 신뢰를 잃는 일이 아니라</text><text class="sub" x="580" y="264.9" font-size="12.5" text-anchor="middle">쌓는 일이다</text></svg>
