</style><marker id="ah-course-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="350" rx="12"/><polygon class="f1 s1" points="50,112 360,24 670,112" stroke-width="1.5"/><text class="ink" x="360" y="76" font-size="14" text-anchor="middle" font-weight="700">02 자주 부딪히는 업무 상황 · 06 업무 알고리즘</text><text class="sub" x="360" y="98" font-size="12" text-anchor="middle">배운 것을 현장 판단과 절차로 바꾼다</text><rect class="f3 s3" x="78" y="124" width="172" height="140" rx="8" stroke-width="1.5"/><text class="ink" x="164" y="150" font-size="14" text-anchor="middle" font-weight="700">03 공학의 기초</text><text class="sub" x="164" y="180" font-size="12.5" text-anchor="middle">통계·공정능력</text><text class="sub" x="164" y="200" font-size="12.5" text-anchor="middle">측정·실험계획(DOE)</text><text class="sub" x="164" y="220" font-size="12.5" text-anchor="middle">응력·확산·전기화학</text><rect class="f2 s2" x="274" y="124" width="172" height="140" rx="8" stroke-width="1.5"/><text class="ink" x="360" y="150" font-size="14" text-anchor="middle" font-weight="700">04 반도체의 기초</text><text class="sub" x="360" y="180" font-size="12.5" text-anchor="middle">트랜지스터·메모리</text><text class="sub" x="360" y="200" font-size="12.5" text-anchor="middle">전공정·후공정</text><text class="sub" x="360" y="220" font-size="12.5" text-anchor="middle">범프·TSV·HBM</text><rect class="f4 s4" x="470" y="124" width="172" height="140" rx="8" stroke-width="1.5"/><text class="ink" x="556" y="150" font-size="14" text-anchor="middle" font-weight="700">05 제조기술의 기초</text><text class="sub" x="556" y="180" font-size="12.5" text-anchor="middle">4M1E·SPC·FDC</text><text class="sub" x="556" y="200" font-size="12.5" text-anchor="middle">변경관리·FMEA·8D</text><text class="sub" x="556" y="220" font-size="12.5" text-anchor="middle">설비·품질 비용</text><rect class="f5 s5" x="50" y="276" width="620" height="58" rx="10" stroke-width="1.5"/><text class="ink" x="360" y="300" font-size="14" text-anchor="middle" font-weight="700">01 엔지니어의 마인드</text><text class="sub" x="360" y="322" font-size="12.5" text-anchor="middle">현상과 해석 구분 · 변화점 먼저 · 빠른 정정 · 기록이 곧 실력</text></svg>
