<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t-course-map"><title id="t-course-map">교육과정 구성도</title><desc>마인드를 바닥에, 공학·반도체·제조 기초를 기둥으로, 업무 상황과 알고리즘 작성을 지붕으로 쌓는 구조</desc><defs><style>
