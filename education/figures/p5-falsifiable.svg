<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t-p5-falsifiable"><title id="t-p5-falsifiable">반증할 수 있는 가설 — 틀릴 수 있어야 검증할 수 있다</title><defs><style>
text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif}
.bg{fill:var(--fig-bg,#fcfcfb)}
.pn{fill:var(--fig-panel,#f1f2f4)}
.ink{fill:var(--fig-ink,#1c2230)}
.sub{fill:var(--fig-sub,#52514e)}
.mut{fill:var(--fig-mut,#898781)}
.ax{stroke:var(--fig-axis,#c3c2b7);fill:none}
.gr{stroke:var(--fig-grid,#e1e0d9);fill:none}
.ed{stroke:var(--fig-edge,#7d8797);fill:none}
.ah{fill:var(--fig-edge,#7d8797)}
.ring{stroke:var(--fig-bg,#fcfcfb)}
.f0{fill:var(--fig-0w,#eef0f3)} .s0{stroke:var(--fig-0,#8a94a6)} .k0{fill:var(--fig-0,#8a94a6)} .l0{stroke:var(--fig-0,#8a94a6);fill:none}
.f1{fill:var(--fig-1w,#dbe8fa)} .s1{stroke:var(--fig-1,#2a78d6)} .k1{fill:var(--fig-1,#2a78d6)} .l1{stroke:var(--fig-1,#2a78d6);fill:none}
.f2{fill:var(--fig-2w,#fbe1d5)} .s2{stroke:var(--fig-2,#eb6834)} .k2{fill:var(--fig-2,#eb6834)} .l2{stroke:var(--fig-2,#eb6834);fill:none}
.f3{fill:var(--fig-3w,#d3f1e5)} .s3{stroke:var(--fig-3,#1baf7a)} .k3{fill:var(--fig-3,#1baf7a)} .l3{stroke:var(--fig-3,#1baf7a);fill:none}
.f4{fill:var(--fig-4w,#fcefcc)} .s4{stroke:var(--fig-4,#eda100)} .k4{fill:var(--fig-4,#eda100)} .l4{stroke:var(--fig-4,#eda100);fill:none}
.f5{fill:var(--fig-5w,#e3dff7)} .s5{stroke:var(--fig-5,#4a3aa7)} .k5{fill:var(--fig-5,#4a3aa7)} .l5{stroke:var(--fig-5,#4a3aa7);fill:none}
.q1{fill:var(--fig-q1,#cde2fb)} .q2{fill:var(--fig-q2,#9ec5f4)} .q3{fill:var(--fig-q3,#6da7ec)}
.good{fill:#0ca30c} .crit{fill:#d03b3b} .critl{stroke:#d03b3b;fill:none} .critw{fill:#d03b3b;fill-opacity:.28}
.m-si{fill:var(--m-si,#c7ccd6)} .m-ox{fill:var(--m-ox,#cfe3f4)} .m-pr{fill:var(--m-pr,#cbbbe9)}
.m-cu{fill:var(--m-cu,#e09a5f)} .m-ni{fill:var(--m-ni,#a9b1bd)} .m-sn{fill:var(--m-sn,#dfe5ec)}
.m-imc{fill:var(--m-imc,#8f7b66)} .m-al{fill:var(--m-al,#b7c4d6)} .m-emc{fill:var(--m-emc,#4c5363)}
.m-sub{fill:var(--m-sub,#7f9c78)} .m-n{fill:var(--m-n,#9fc3f0)} .m-p{fill:var(--m-p,#f2d2c2)} .m-gate{fill:var(--m-gate,#8b93a7)}
.m-bath{fill:var(--m-bath,#e7f1fb)}
.nterm{fill:var(--n-term-fill,#e8f6ee);stroke:var(--n-term-stroke,#2e9e5b)}
.nproc{fill:var(--n-process-fill,#ffffff);stroke:var(--n-process-stroke,#8a94a6)}
.ndec{fill:var(--n-decision-fill,#fff6e3);stroke:var(--n-decision-stroke,#d9921a)}
.nio{fill:var(--n-io-fill,#edf2ff);stroke:var(--n-io-stroke,#5b7bd5)}
.mono{font-family:ui-monospace,'D2Coding',Consolas,monospace}
</style><marker id="ah-p5-falsifiable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="300" rx="12"/><rect class="pn" x="14" y="14" width="250" height="272" rx="10"/><text class="ink" x="139" y="42" font-size="14" text-anchor="middle" font-weight="700">✗ 쓸모없는 가설</text><rect class="f0 s0" x="30" y="62" width="218" height="70" rx="10" stroke-width="1.5"/><text class="ink" x="139" y="92.3" font-size="13.5" text-anchor="middle" font-weight="600">“여러 요인이</text><text class="ink" x="139" y="109.8" font-size="13.5" text-anchor="middle" font-weight="600">복합적으로 작용했다”</text><text class="sub" x="139" y="168" font-size="12.5" text-anchor="middle">어떤 결과가 나와도</text><text class="sub" x="139" y="186.8" font-size="12.5" text-anchor="middle">“맞다”고 할 수 있다</text><text class="sub" x="139" y="205.5" font-size="12.5" text-anchor="middle">→ 아무것도 검증하지 못한다</text><rect class="pn" x="278" y="14" width="428" height="272" rx="10"/><text class="ink" x="492" y="42" font-size="14" text-anchor="middle" font-weight="700">✓ 좋은 가설 — 예측을 품고 있다</text><rect class="f1 s1" x="294" y="58" width="396" height="56" rx="10" stroke-width="1.5"/><text class="ink" x="492" y="81.4" font-size="13" text-anchor="middle" font-weight="600">Ni 두께가 원인이라면</text><text class="ink" x="492" y="98.3" font-size="13" text-anchor="middle" font-weight="600">→ Ni가 얇은 site일수록 찢어짐이 많아야 한다</text><line class="ax" x1="340" y1="260" x2="560" y2="260" stroke-width="1.5"/><line class="ax" x1="340" y1="260" x2="340" y2="140" stroke-width="1.5"/><text class="mut" x="450" y="278" font-size="11" text-anchor="middle">Ni 두께 (얇음 → 두꺼움)</text><text class="mut" x="334" y="146" font-size="11" text-anchor="end">찢어짐</text><circle class="k1 ring" cx="362" cy="158" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="384" cy="176" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="406" cy="173.6" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="439" cy="200" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="461" cy="209.6" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="494" cy="224" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="520.4" cy="233.6" r="4.5" stroke-width="2"/><circle class="k1 ring" cx="542.4" cy="242" r="4.5" stroke-width="2"/><line class="l1" x1="350" y1="152" x2="550" y2="245.6" stroke-width="1.4" stroke-dasharray="4 3"/><text class="ink" x="574" y="168" font-size="12" text-anchor="start" font-weight="600">관측이 예측과 같다</text><text class="ink" x="574" y="184.2" font-size="12" text-anchor="start" font-weight="600">→ 다음 검증으로</text><text class="sub" x="574" y="222" font-size="12" text-anchor="start">관측이 다르다</text><text class="sub" x="574" y="238.2" font-size="12" text-anchor="start">→ 가설을 버린다</text></svg>
