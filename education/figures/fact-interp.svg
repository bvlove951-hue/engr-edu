</style><marker id="ah-fact-interp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="260" rx="12"/><rect class="pn" x="170" y="18" width="380" height="46" rx="23"/><text class="ink" x="360" y="47" font-size="15" text-anchor="middle" font-weight="700">“Ni 두께가 얇아서 범프가 찢어졌다.”</text><line class="ed" x1="360" y1="66" x2="130" y2="104" stroke-width="1.6" marker-end="url(#ah-fact-interp)"/><rect class="f3 s3" x="30" y="108" width="200" height="92" rx="10" stroke-width="1.5"/><rect class="f3 s3" x="42" y="117.5" width="43.4" height="20.5" rx="10.25" stroke-width="1"/><text class="ink" x="63.7" y="133" font-size="11.5" text-anchor="middle" font-weight="700">[측정]</text><text class="ink" x="130" y="160" font-size="13.5" text-anchor="middle" font-weight="600">3번 lot에서</text><text class="ink" x="130" y="178.2" font-size="13.5" text-anchor="middle" font-weight="600">범프 찢어짐 2.1%</text><line class="ed" x1="360" y1="66" x2="360" y2="104" stroke-width="1.6" marker-end="url(#ah-fact-interp)"/><rect class="f3 s3" x="260" y="108" width="200" height="92" rx="10" stroke-width="1.5"/><rect class="f3 s3" x="272" y="117.5" width="43.4" height="20.5" rx="10.25" stroke-width="1"/><text class="ink" x="293.7" y="133" font-size="11.5" text-anchor="middle" font-weight="700">[측정]</text><text class="ink" x="360" y="160" font-size="13.5" text-anchor="middle" font-weight="600">같은 lot Ni 두께</text><text class="ink" x="360" y="178.2" font-size="13.5" text-anchor="middle" font-weight="600">기준 대비 −8%</text><line class="ed" x1="360" y1="66" x2="590" y2="104" stroke-width="1.6" marker-end="url(#ah-fact-interp)"/><rect class="f4 s4" x="490" y="108" width="200" height="92" rx="10" stroke-width="1.5"/><rect class="f4 s4" x="502" y="117.5" width="43.4" height="20.5" rx="10.25" stroke-width="1"/><text class="ink" x="523.7" y="133" font-size="11.5" text-anchor="middle" font-weight="700">[가정]</text><text class="ink" x="590" y="160" font-size="13.5" text-anchor="middle" font-weight="600">두께 저하가</text><text class="ink" x="590" y="178.2" font-size="13.5" text-anchor="middle" font-weight="600">찢어짐의 원인 (검증 전)</text><text class="sub" x="360" y="232" font-size="13" text-anchor="middle">꼬리표를 붙이면 듣는 사람이 어디를 믿고 어디를 검증할지 바로 안다</text></svg>
