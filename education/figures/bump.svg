</style><marker id="ah-bump" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="312" rx="12"/><rect class="pn" x="12" y="12" width="342" height="260" rx="10"/><text class="ink" x="28" y="38" font-size="14" text-anchor="start" font-weight="700">베이스 다이 범프 — Cu / Ni / Cu / SnAg</text><text class="sub" x="28" y="58" font-size="11.5" text-anchor="start">인터포저 쪽 · 예시 12 / 3 / 3 / 12 µm</text><rect class="m-si" x="22" y="214" width="186" height="26" rx="2"/><rect class="m-ox" x="22" y="209" width="186" height="5" rx="1"/><rect class="m-al" x="24" y="206" width="88" height="8" rx="1"/><rect class="m-al" x="114" y="206" width="88" height="8" rx="1"/><text class="sub" x="113" y="232" font-size="11" text-anchor="middle">웨이퍼 · 패드</text><text class="ink" x="68" y="258" font-size="12.5" text-anchor="middle" font-weight="700">도금 직후</text><text class="ink" x="158" y="258" font-size="12.5" text-anchor="middle" font-weight="700">리플로우 후</text><rect class="m-cu" x="28" y="167.6" width="80" height="38.4" rx="1"/><rect class="m-ni" x="28" y="158" width="80" height="9.6" rx="1"/><rect class="m-cu" x="28" y="148.4" width="80" height="9.6" rx="1"/><rect class="m-sn ed" x="28" y="110" width="80" height="38.4" rx="1" stroke-width="0.8"/><text class="mut" x="68" y="102" font-size="11.5" text-anchor="middle">높이 30 µm</text><rect class="m-cu" x="118" y="167.6" width="80" height="38.4" rx="1"/><rect class="m-ni" x="118" y="158" width="80" height="9.6" rx="1"/><rect class="m-cu" x="118" y="150.6" width="80" height="7.4" rx="1"/><rect class="m-imc" x="118" y="144.2" width="80" height="6.4" rx="1"/><path class="m-sn ed" d="M117,144.2 C113,77.3 203,77.3 199,144.2 Z" stroke-width="0.8"/><line class="ed" x1="192" y1="124.6" x2="218" y2="96" stroke-width="1.1"/><text class="ink" x="222" y="100" font-size="12" text-anchor="start" font-weight="700">SnAg 솔