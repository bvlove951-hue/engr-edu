82" y="190" width="80" height="16" rx="1"/><rect class="m-sn ed" x="382" y="151.6" width="80" height="38.4" rx="1" stroke-width="0.8"/><text class="mut" x="422" y="143.6" font-size="11.5" text-anchor="middle">높이 17 µm</text><line class="ax" x1="376" y1="110" x2="562" y2="110" stroke-width="1.2" stroke-dasharray="4 3"/><text class="mut" x="382" y="104" font-size="11" text-anchor="start">베이스 범프 높이 (30 µm)</text><rect class="m-ni" x="472" y="191" width="80" height="15" rx="1"/><rect class="m-imc" x="472" y="187" width="80" height="4" rx="1"/><path class="m-sn ed" d="M471,187 C467,120 557,120 553,187 Z" stroke-width="0.8"/><line class="ed" x1="546" y1="165" x2="572" y2="142" stroke-width="1.1"/><text class="ink" x="576" y="146" font-size="12" text-anchor="start" font-weight="700">SnAg 솔더</text><text class="sub" x="576" y="161" font-size="11" text-anchor="start">두 다이 같은 양</text><line class="ed" x1="554" y1="189" x2="572" y2="180" stroke-width="1.1"/><text class="ink" x="576" y="184" font-size="12" text-anchor="start" font-weight="700">IMC — Ni₃Sn₄</text><text class="sub" x="576" y="199" font-size="11" text-anchor="start">Ni와 솔더 사이</text><line class="ed" x1="554" y1="199" x2="572" y2="218" stroke-width="1.1"/><text class="ink" x="576" y="222" font-size="12" text-anchor="start" font-weight="700">Ni — 몸통 겸 방벽</text><text class="sub" x="576" y="237" font-size="11" text-anchor="start">Cu 기둥 없이</text><text class="sub" x="576" y="251.8" font-size="11" text-anchor="start">시드 위에 바로</text><text class="sub" x="360" y="296" font-size="12" text-anchor="middle">같은 축척 · 두께는 예시 — 상부 Cu는 Ni 위에 얇게 한 번 더 올린 Cu (베이스 다이만)</text></svg>
