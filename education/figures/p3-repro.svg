</style><marker id="ah-p3-repro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="300" rx="12"/><rect class="pn" x="14" y="14" width="330" height="272" rx="10"/><text class="ink" x="179" y="40" font-size="14" text-anchor="middle" font-weight="700">✗ 조건이 다른 비교</text><text class="ink" x="104" y="66" font-size="12.5" text-anchor="middle" font-weight="700">개선 전</text><text class="sub" x="104" y="84" font-size="11.5" text-anchor="middle">장비 A · 약품 lot 1 · 월</text><text class="ink" x="254" y="66" font-size="12.5" text-anchor="middle" font-weight="700">개선 후</text><text class="sub" x="254" y="84" font-size="11.5" text-anchor="middle">장비 B · 약품 lot 2 · 목</text><line class="ax" x1="34" y1="250" x2="324" y2="250" stroke-width="1.5"/><circle class="k0 ring" cx="80" cy="188" r="5" stroke-width="2"/><circle class="k1 ring" cx="230" cy="215" r="5" stroke-width="2"/><text class="mut" x="179" y="270" font-size="11" text-anchor="middle">불량률 (높을수록 나쁨)</text><rect class="pn" x="376" y="14" width="330" height="272" rx="10"/><text class="ink" x="541" y="40" font-size="14" text-anchor="middle" font-weight="700">✓ 조건을 맞춘 비교</text><text class="ink" x="466" y="66" font-size="12.5" text-anchor="middle" font-weight="700">개선 전</text><text class="sub" x="466" y="84" font-size="11.5" text-anchor="middle">같은 장비·lot·계측</text><text class="ink" x="616" y="66" font-size="12.5" text-anchor="middle" font-weight="700">개선 후</text><text class="sub" x="616" y="84" font-size="11.5" text-anchor="middle">웨이퍼를 나눠 동시에</text><line class="ax" x1="396" y1="250" x2="686" y2="250" stroke-width="1.5"/><circle class="k0 ring" cx="442" cy="190" r="5" stroke-width="2"/><circle class="k0 ring" cx="454" cy="184" r="5" stroke-width="2"/><circle class="k0 ring" cx="466" cy="193" r="5" stroke-width="2"/><circle class="k0 ring" cx="478" cy="187" r="5" stroke-width="2"/><circle class="k0 ring" cx="490" cy="189" r="5" stroke-width="2"/><circle class="k1 ring" cx="592" cy="217" r="5" stroke-width="2"/><circle class="k1 ring" cx="604" cy="213" r="5" stroke-width="2"/><circle class="k1 ring" cx="616" cy="220" r="5" stroke-width="2"/><circle class="k1 ring" cx="628" cy="215" r="5" stroke-width="2"/><circle class="k1 ring" cx="640" cy="216" r="5" stroke-width="2"/><text class="mut" x="541" y="270" font-size="11" text-anchor="middle">불량률 (높을수록 나쁨)</text><text class="ink" x="179" y="116" font-size="12" text-anchor="middle" font-weight="600">좋아진 이유가</text><text class="ink" x="179" y="132.2" font-size="12" text-anchor="middle" font-weight="600">개선 때문인지 모른다</text><text class="ink" x="541" y="116" font-size="12" text-anchor="middle" font-weight="600">5번 반복해도 같은 차이</text><text class="ink" x="541" y="132.2" font-size="12" text-anchor="middle" font-weight="600">→ 개선 효과로 판단</text></svg>
