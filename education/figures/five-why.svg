.mono{font-family:ui-monospace,'D2Coding',Consolas,monospace}
</style><marker id="ah-five-why" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="380" rx="12"/><rect class="f2 s2" x="150" y="18" width="420" height="40" rx="8" stroke-width="1.5"/><text class="ink" x="360" y="43" font-size="13.5" text-anchor="middle" font-weight="600">특정 위치 범프가 찢어진다</text><text class="ink" x="136" y="43" font-size="12.5" text-anchor="end" font-weight="700">현상</text><line class="ed" x1="360" y1="58" x2="400" y2="76" stroke-width="1.6" marker-end="url(#ah-five-why)"/><text class="mut" x="626" y="43" font-size="11.5" text-anchor="start">✔ 데이터 확인</text><rect class="f0 s0" x="190" y="76" width="420" height="40" rx="8" stroke-width="1"/><text class="ink" x="400" y="101" font-size="13.5" text-anchor="middle" font-weight="600">그 위치 범프에 응력이 몰린다</text><text class="sub" x="176" y="101" font-size="12.5" text-anchor="end" font-weight="700">왜?</text><line class="ed" x1="400" y1="116" x2="360" y2="134" stroke-width="1.6" marker-end="url(#ah-five-why)"/><text class="mut" x="626" y="101" font-size="11.5" text-anchor="start">✔ 데이터 확인</text><rect class="f0 s0" x="150" y="134" width="420" height="40" rx="8" stroke-width="1"/><text class="ink" x="360" y="159" font-size="13.5" text-anchor="middle" font-weight="600">높이가 낮은 범프가 늘어나며 버틴다</text><text class="sub" x="136" y="159" font-size="12.5" text-anchor="end" font-weight="700">왜?</text><line class="ed" x1="360" y1="174" x2="400" y2="192" stroke-width="1.6" marker-end="url(#ah-five-why)"/><text class="mut" x="626" y="159" font-size="11.5" text-anchor="start">✔ 데이터 확인</text><rect class="f0 s0" x="190" y="192" width="420" height="40" rx="8" stroke-width="1"/><text class="ink" x="400" y="217" font-size="13.5" text-anchor="middle" font-weight="600">웨이퍼 가장자리 도금 두께가 얇다</text><text class="sub" x="176" y="217" font-size="12.5" text-anchor="end" font-weight="700">왜?</text><line class="ed" x1="400" y1="232" x2="360" y2="250" stroke-width="1.6" marker-end="url(#ah-five-why)"/><text class="mut" x="626" y="217" font-size="11.5" text-anchor="start">✔ 데이터 확인</text><rect class="f0 s0" x="150" y="250" width="420" height="40" rx="8" stroke-width="1"/><text class="ink" x="360" y="275" font-size="13.5" text-anchor="middle" font-weight="600">가장자리 전류 분포가 바뀌었다</text><text class="sub" x="136" y="275" font-size="12.5" text-anchor="end" font-weight="700">왜?</text><line class="ed" x1="360" y1="290" x2="400" y2="308" stroke-width="1.6" marker-end="url(#ah-five-why)"/><text class="mut" x="626" y="275" font-size="11.5" text-anchor="start">✔ 데이터 확인</text><rect class="f3 s3" x="190" y="308" width="420" height="40" rx="8" stroke-width="1.5"/><text class="ink" x="400" y="333" font-size="13.5" text-anchor="middle" font-weight="600">전류 분포를 잡는 부품이 마모되었다</text><text class="ink" x="176" y="333" font-size="12.5" text-anchor="end" font-weight="700">근본 원인</text><text class="sub" x="360" y="370" font-size="12.5" text-anchor="middle">대책은 근본 원인에 건다 → 마모 부품의 교체 주기를 관리 항목에 넣는다</text></svg>
