<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t-five-why"><title id="t-five-why">5 Why — 왜를 다섯 번, 답마다 데이터로 확인</title><defs><style>
