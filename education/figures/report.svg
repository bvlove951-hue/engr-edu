</style><marker id="ah-report" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="290" rx="12"/><text class="ink" x="165" y="34" font-size="14" text-anchor="middle" font-weight="700">✗ 시간 순서대로 쓴 보고</text><text class="ink" x="520" y="34" font-size="14" text-anchor="middle" font-weight="700">✓ 결론 먼저 쓴 보고</text><rect class="f0 s0" x="60" y="50" width="210" height="32" rx="6" stroke-width="1.2"/><text class="ink" x="165" y="71" font-size="13" text-anchor="middle">배경 설명</text><line class="ed" x1="165" y1="82" x2="165" y2="92" stroke-width="1.2" marker-end="url(#ah-report)"/><rect class="f0 s0" x="60" y="92" width="210" height="32" rx="6" stroke-width="1.2"/><text class="ink" x="165" y="113" font-size="13" text-anchor="middle">처음 한 실험</text><line class="ed" x1="165" y1="124" x2="165" y2="134" stroke-width="1.2" marker-end="url(#ah-report)"/><rect class="f0 s0" x="60" y="134" width="210" height="32" rx="6" stroke-width="1.2"/><text class="ink" x="165" y="155" font-size="13" text-anchor="middle">그다음 실험</text><line class="ed" x1="165" y1="166" x2="165" y2="200" stroke-width="1.2" marker-end="url(#ah-report)"/><rect class="f0 s0" x="60" y="200" width="210" height="32" rx="6" stroke-width="1.2"/><text class="ink" x="165" y="221" font-size="13" text-anchor="middle">데이터 해석</text><line class="ed" x1="165" y1="232" x2="165" y2="242" stroke-width="1.2" marker-end="url(#ah-report)"/><rect class="f2 s2" x="60" y="242" width="210" height="32" rx="6" stroke-width="1.2"/><text class="ink" x="165" y="263" font-size="13" text-anchor="middle" font-weight="600">결론 · 요청</text><line class="critl" x1="36" y1="183" x2="294" y2="183" stroke-width="1.5" stroke-dasharray="5 4"/><rect class="bg" x="75.4" y="175.5" width="179.3" height="18.5" rx="4"/><text class="ink" x="165" y="188" font-size="11.5" text-anchor="middle" font-weight="600">바쁜 상사는 여기